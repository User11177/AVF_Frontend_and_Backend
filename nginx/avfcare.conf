# ================================
# 全站速率限制配置 (按 IP 統一限制)
# ================================
# 全站統一限制：每個 IP 每分鐘最多 100 次請求
limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;

# 連接數限制：每個 IP 最多 10 個並發連接(同api)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ================================
# HTTP → HTTPS 強制跳轉 (Certbot 管理)
# ================================
server {
    listen 80;
    server_name avfcare.com;
    
    # Certbot 管理的重定向邏輯
    if ($host = avfcare.com) {
        return 301 https://$host$request_uri;
    }
    
    # 預設返回 404 (Certbot 管理)
    return 404;
}

# ================================
# HTTPS 反向代理到 FastAPI
# ================================
server {
    listen 443 ssl http2;  # 監聽 443 (HTTPS)，啟用 HTTP/2
    server_name avfcare.com;

    # ----------------
    # SSL 憑證配置
    # ----------------
    ssl_certificate /etc/letsencrypt/live/avfcare.com/fullchain.pem;    # 公鑰憑證
    ssl_certificate_key /etc/letsencrypt/live/avfcare.com/privkey.pem;  # 私鑰

    # ----------------
    # SSL 安全配置 (Certbot 管理)
    # ----------------
    include /etc/letsencrypt/options-ssl-nginx.conf;  # Certbot 管理的 SSL 選項
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;    # Certbot 管理的 DH 參數

    # ----------------
    # HTTP 安全標頭
    # ----------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # 強制所有子網域走 HTTPS (HSTS)
    add_header X-Frame-Options DENY always;        # 禁止被 iframe 載入 (防點擊劫持)
    add_header X-Content-Type-Options nosniff always; # 禁止瀏覽器自動 MIME 嗅探
    add_header X-XSS-Protection "1; mode=block" always; # 瀏覽器開啟 XSS 過濾

    # ----------------
    # Log 紀錄 (方便除錯)
    # ----------------
    access_log /var/log/nginx/avfcare.access.log;
    error_log  /var/log/nginx/avfcare.error.log;

    # ----------------
    # 全站統一限制 (所有路徑)
    # ----------------
    limit_req zone=global burst=20 nodelay;  # 每分鐘 100 次，允許突發 20 次
    limit_conn conn_limit 10;                # 每個 IP 最多 10 個並發連接
    limit_req_status 429;                    # 超出限制時返回 429 狀態碼

    # ----------------
    # 路徑設定
    # ----------------
    location = / {
        return 302 /docs; # 如果訪問根路徑，自動導向 /docs (FastAPI 的 Swagger UI)
    }

    # ---------------- 
    # WebSocket 代理設定 (聊天室用)
    # ---------------- 
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;   # 轉發 WebSocket 到 FastAPI (使用 Docker 服務名)
        
        # WebSocket 專用配置
        proxy_http_version 1.1;                  # 使用 HTTP/1.1 協議
        proxy_set_header Upgrade $http_upgrade;  # 支援協議升級 (HTTP → WebSocket)
        proxy_set_header Connection "upgrade";   # 設置連接類型為 upgrade
        
        # 標準代理標頭
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;        
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 超時設定 (較長，因為是長連接)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;    # 發送超時 5 分鐘
        proxy_read_timeout 300s;    # 讀取超時 5 分鐘
        
        # 禁用緩衝 (WebSocket 需要即時傳輸)
        proxy_buffering off;
    }

    # ---------------- 
    # HTTP API 反向代理設定
    # ---------------- 
    location / {
        proxy_pass http://127.0.0.1:8000;    # ✅ 轉發到 FastAPI 服務 (容器在 8000)
        proxy_set_header Host $host;         # 保留原始 Host
        proxy_set_header X-Real-IP $remote_addr;         # 傳遞使用者真實 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 支援多層代理
        proxy_set_header X-Forwarded-Proto $scheme;     # 傳遞協議 (HTTP / HTTPS)

        # ---- 代理超時設定 ----
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # ---- 代理緩衝設定 ----
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
